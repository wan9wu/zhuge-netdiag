[package]
name = "zhuge-netdiag"
version = "0.1.0"
edition = "2021"
description = "诸葛网络问题诊断器 - 自动检测本机网络环境、逐跳诊断本机到公网的链路并定位网络瓶颈"
license = "MIT"
readme = "README.md"
keywords = ["network", "diagnostics", "ping", "traceroute", "windows"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
ipconfig = "0.3"
eframe = { version = "0.32", optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe"]

[lib]
name = "zhuge_netdiag"
path = "src/lib.rs"

[[bin]]
name = "zhuge-netdiag"
path = "src/main.rs"

[[bin]]
name = "zhuge-netdiag-gui"
path = "src/bin/zhuge-netdiag-gui.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
strip = true
